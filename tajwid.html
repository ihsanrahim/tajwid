<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tajwid Tahun 4-6 &mdash; Nota &amp; Kuiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0d2035;
  --bg2:#123049;
  --panel:#fbf6ea;
  --panel-2:#f3ecd9;
  --ink:#1c2733;
  --ink-soft:#4a5867;
  --gold:#d3a12b;
  --gold-soft:#e9c877;
  --teal:#39b8a4;
  --red:#c0463b;
  --green:#2e8b57;
  --line:#25415c;
  --radius:16px;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-head:'Fraunces','Georgia',serif;
  --font-ar:'Amiri','Traditional Arabic',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--panel);
  font-family:var(--font-ui);
  font-size:18px;
  line-height:1.55;
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* ---------- Waveform signature divider ---------- */
.wave{
  height:14px;width:100%;
  background:repeating-linear-gradient(90deg,transparent 0 6px,var(--gold) 6px 8px,transparent 8px 18px);
  opacity:.55;mask:linear-gradient(#000,#000);
}
.wave.small{height:8px}

/* ---------- Sticky header ---------- */
#topbar{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.topbar-row{
  display:flex;align-items:center;gap:12px;
  padding:8px 14px;max-width:1100px;margin:0 auto;
}
.brand{
  font-family:var(--font-head);font-weight:700;font-size:19px;color:var(--gold-soft);
  white-space:nowrap;flex:0 0 auto;
}
.mode-tabs{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
.mode-tab{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg2);color:var(--panel);font-weight:700;font-size:13px;
}
.mode-tab.active{background:var(--gold);color:#2b1c00;border-color:var(--gold)}
.global-counter{
  flex:1 1 auto;text-align:end;font-size:13px;color:#b9c6d2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.global-counter b{color:var(--gold-soft)}
.rumi-toggle{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  background:var(--bg2);border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:13px;color:var(--panel);
}
.rumi-toggle input{accent-color:var(--gold)}
.topic-rail{
  display:flex;gap:7px;overflow-x:auto;padding:8px 14px 10px;
  max-width:1100px;margin:0 auto;scrollbar-width:thin;
}
.topic-chip{
  flex:0 0 auto;width:38px;height:38px;border-radius:10px;
  border:2px solid var(--line);background:var(--bg2);color:var(--panel);
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
  position:relative;
}
.topic-chip.active{border-color:var(--gold-soft);box-shadow:0 0 0 2px rgba(211,161,43,.35)}
.topic-chip.started{background:#4a3a12;border-color:var(--gold)}
.topic-chip.all-correct{background:var(--green);border-color:var(--green);color:#fff}
.topic-chip.has-wrong{background:var(--red);border-color:var(--red);color:#fff}
.topic-chip.summary-chip{width:auto;padding:0 12px;border-radius:999px;font-size:13px}
.rail-hint{
  max-width:1100px;margin:0 auto;padding:0 14px 8px;font-size:12px;color:#8296a6;
}

/* ---------- Layout ---------- */
main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.card{
  background:var(--panel);color:var(--ink);
  border-radius:var(--radius);padding:22px 22px 26px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
h1.page-title{
  font-family:var(--font-head);color:var(--gold-soft);
  font-size:26px;margin:6px 0 2px;
}
.subtle{color:#b9c6d2;font-size:14px;margin:0 0 14px}


.tabs{display:flex;gap:8px;margin:14px 0 16px}
.tab-btn{
  padding:9px 18px;border-radius:10px 10px 0 0;border:1px solid var(--line);
  background:var(--bg2);color:var(--panel);font-weight:600;font-size:15px;
  border-bottom:none;
}
.tab-btn.active{background:var(--panel);color:var(--ink)}

/* ---------- Notes styling ---------- */
.notes-body{font-size:19px}
.notes-body h3{
  font-family:var(--font-head);color:#7a5410;font-size:21px;
  margin:22px 0 8px;border-bottom:2px solid var(--gold);padding-bottom:4px;
}
.notes-body h4{color:#7a5410;font-size:18px;margin:16px 0 6px}
.notes-body p{margin:8px 0}
.notes-body ul,.notes-body ol{padding-inline-start:26px;margin:8px 0}
.notes-body li{margin:6px 0}
.tbl{border-collapse:collapse;width:100%;margin:10px 0 18px;font-size:17px}
.tbl th,.tbl td{border:1px solid #d8cba4;padding:9px 12px;text-align:start;vertical-align:top}
.tbl th{background:var(--panel-2);color:#5a3d09;font-weight:700}
.tbl tr:nth-child(even) td{background:#f8f3e4}
.ayat{
  font-family:var(--font-ar);font-weight:700;font-size:32px;line-height:2.1;
  direction:rtl;text-align:center;color:#1c2733;
  background:var(--panel-2);border-inline-start:5px solid var(--gold);
  border-radius:10px;padding:16px 18px;margin:14px 0 6px;
}
.translit{
  direction:ltr;text-align:left;color:#5a4a2b;font-style:italic;font-size:16px;margin:4px 2px 10px;
}
.terj{font-size:16px;color:#3a3226;margin:4px 2px 14px}

/* Rumi-mode indentation/LTR rule (applies to any block once Rumi toggle is on) */
body.rumi-on .ayat{direction:rtl} /* Quran stays Arabic regardless of toggle */
body.rumi-on .jawi-text{
  direction:ltr;text-align:left;
  padding-left:14px;border-left:3px solid var(--teal);
  font-family:var(--font-ui);
}
body.rumi-on .notes-body,
body.rumi-on .q-stem,
body.rumi-on .opt-label,
body.rumi-on .subtopic-head,
body.rumi-on .glossary-term,
body.rumi-on .glossary-def,
body.rumi-on .chart-tbl th,
body.rumi-on .chart-tbl td:not(.ar-ex){
  direction:ltr;text-align:left;
}
body:not(.rumi-on) .notes-body,
body:not(.rumi-on) .q-stem,
body:not(.rumi-on) .opt-label,
body:not(.rumi-on) .subtopic-head,
body:not(.rumi-on) .glossary-term,
body:not(.rumi-on) .glossary-def,
body:not(.rumi-on) .chart-tbl th,
body:not(.rumi-on) .chart-tbl td:not(.ar-ex){
  direction:rtl;text-align:right;font-family:var(--font-ar);
}
/* Jawi = RTL with a traditional first-line indent.
   Must target block-level containers (text-indent has no effect on inline spans). */
body:not(.rumi-on) .notes-body p,
body:not(.rumi-on) .notes-body li,
body:not(.rumi-on) .q-stem,
body:not(.rumi-on) .opt,
body:not(.rumi-on) .glossary-def{
  text-indent:1.4em;
}
.dbp-note{font-size:12px;color:#8a95a1;margin-top:2px}


/* ---------- Quiz (single scrollable page per topic) ---------- */
.quiz-summary-bar{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
  font-size:14px;color:#5a5346;
}
.progress-track{flex:1;height:8px;background:#e6ddc0;border-radius:99px;margin:0 12px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);width:0%;transition:width .25s}
.subtopic-block{margin:22px 0 6px}
.subtopic-head{
  font-family:var(--font-head);font-size:18px;color:#7a5410;
  border-bottom:2px dashed var(--gold);padding-bottom:5px;margin-bottom:12px;
}
.q-card{margin-bottom:18px;padding-bottom:4px}
.q-stem{font-size:20px;font-weight:600;margin:6px 0 14px;line-height:1.5}
.opt{
  display:block;width:100%;text-align:start;
  background:#fff;border:2px solid #ddd2ab;border-radius:12px;
  padding:13px 16px;margin:9px 0;font-size:18px;color:var(--ink);
}
.opt:hover{border-color:var(--gold)}
.opt.selected{border-color:var(--gold);background:#fdf3d9}
.opt.correct{border-color:var(--green);background:#e3f5e8;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fbe6e3}
.opt.unanswered-flag{border-color:var(--red);border-style:dashed}
.q-card.needs-answer{outline:2px dashed var(--red);outline-offset:6px;border-radius:12px}

.bottom-actions{
  position:sticky;bottom:0;background:var(--panel);
  margin:26px -22px -26px;padding:16px 22px;
  border-top:2px solid var(--gold-soft);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  border-radius:0 0 var(--radius) var(--radius);
}
.btn{
  padding:12px 22px;border-radius:12px;border:none;font-weight:700;font-size:16px;
}
.btn-primary{background:var(--gold);color:#2b1c00}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--panel)}
.btn-outline{background:#fff;border:2px solid var(--gold);color:#7a5410}
.btn-danger{background:var(--red);color:#fff}
.grade-msg{font-size:15px;font-weight:600;margin-inline-start:auto}
.grade-msg.ok{color:var(--green)}
.grade-msg.bad{color:#96261a}


/* ---------- Summary / home ---------- */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.summary-item{
  background:#fff;border:1px solid #e2d7ae;border-radius:12px;padding:12px 14px;
}
.summary-item .ttl{font-weight:700;font-size:15px;margin-bottom:6px}
.summary-item .stat{font-size:13px;color:#5a5a5a}
.summary-item .mini-bar{height:6px;background:#eee0b8;border-radius:99px;margin-top:6px;overflow:hidden}
.summary-item .mini-fill{height:100%;background:var(--teal)}

footer.danger-zone{
  margin-top:34px;padding-top:18px;border-top:1px dashed var(--line);
  text-align:center;
}
footer.danger-zone p{font-size:13px;color:#9fb0bd;margin-bottom:10px}

/* ---------- Glossary ---------- */
.glossary-list{margin-top:8px}
.glossary-item{
  padding:14px 0;border-bottom:1px solid #e6ddc0;
}
.glossary-item:last-child{border-bottom:none}
.glossary-term{
  font-family:var(--font-head);font-weight:700;font-size:19px;color:#7a5410;
  margin-bottom:4px;
}
.glossary-def{font-size:17px;line-height:1.55}
.glossary-jump{
  display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;
  padding:10px;background:var(--panel-2);border-radius:10px;
}
.glossary-jump a{
  font-size:13px;color:#7a5410;text-decoration:none;font-weight:700;
  padding:3px 7px;border-radius:6px;
}
.glossary-jump a:hover{background:#e9dcae}

/* ---------- Complete chart ---------- */
.chart-scroll{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.chart-tbl{border-collapse:collapse;width:100%;min-width:820px;font-size:15px}
.chart-tbl th,.chart-tbl td{
  border:1px solid #d8cba4;padding:10px 12px;text-align:start;vertical-align:top;
}
.chart-tbl th{background:var(--panel-2);color:#5a3d09;font-weight:700;position:sticky;top:0}
.chart-tbl tr:nth-child(even) td{background:#f8f3e4}
.chart-tbl .ar-ex{font-family:var(--font-ar);font-size:19px;direction:rtl;text-align:center}
.chart-topic-link{
  display:inline-block;background:var(--gold);color:#2b1c00;font-weight:700;
  font-size:12px;padding:2px 8px;border-radius:999px;
}
.chart-hint{font-size:13px;color:#7a6a44;margin:6px 0 4px}

@media (max-width:600px){
  body{font-size:16px}
  .ayat{font-size:26px}
  .q-stem{font-size:18px}
  .opt{font-size:16px}
  h1.page-title{font-size:22px}
}

</style>
</head>
<body>
<div id="topbar">
  <div class="topbar-row">

    <div class="mode-tabs">

      <button class="mode-tab" data-mode="kuiz">Kuiz</button>

      <button class="mode-tab" data-mode="carta">Carta</button>

      <input type="checkbox" id="rumiToggle">
      <span>Rumi</span>
    </label>
  </div>
  <div class="topic-rail" id="topicRail"></div>
</div>
<main id="mainArea"></main>

Al-Khaisyum"], "correct": 0, "diff": "mudah"}, {"q": "Huruf غ dan خ keluar daripada bahagian tekak yang mana?", "opts": ["Hujung tekak", "Tengah tekak", "Pangkal tekak", "Bukan dari tekak"], "correct": 2, "diff": "sukar"}, {"q": "Huruf ء dan ه keluar daripada bahagian tekak yang mana?", "opts": ["Pangkal tekak", "Tengah tekak", "Hujung tekak (paling hampir rongga mulut)", "Tengah lidah"], "correct": 2, "diff": "sukar"}, {"q": "Huruf ع dan ح keluar daripada bahagian tekak yang mana?", "opts": ["Pangkal tekak", "Tengah tekak", "Hujung tekak", "Bukan dari tekak"], "correct": 1, "diff": "sukar"}, {"q": "Huruf ث ذ ظ (menyentuh hujung lidah dan hujung dua gigi hadapan atas) tergolong dalam makhraj...", "opts": ["Asy-Syafatan", "Al-Lisan", "Al-Halq", "Al-Jauf"], "correct": 1, "diff": "mudah"}, {"q": "Huruf ض keluar dari tepi lidah bertemu dengan...", "opts": ["Gusi hadapan", "Gigi geraham atas", "Dua bibir", "Rongga hidung"], "correct": 1, "diff": "sukar"}, {"q": "Huruf ق keluar daripada...", "opts": ["Hujung lidah", "Pangkal lidah bertemu lelangit lembut", "Tengah lidah", "Dua bibir"], "correct": 1, "diff": "sukar"}, {"q": "Huruf ل ن ر sama-sama keluar berhampiran...", "opts": ["Hujung lidah dekat gusi", "Pangkal lidah", "Tengah lidah", "Dua bibir"], "correct": 0, "diff": "sukar"}, {"q": "Huruf ص ز س (bunyi berdesis) keluar daripada pertemuan hujung lidah dengan...", "opts": ["Hujung dua gigi hadapan bawah", "Lelangit lembut", "Rongga hidung", "Dua bibir"], "correct": 0, "diff": "sukar"}, {"q": "Huruf ج ش ي keluar daripada bahagian lidah yang mana?", "opts": ["Hujung lidah", "Tepi lidah", "Tengah lidah", "Pangkal lidah"], "correct": 2, "diff": "mudah"}]}, {"id": 5, "title": "Basmalah", "notes": "\n<h3>Lafaz Basmalah</h3>\n<div class=\"ayat\">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>\n<p class=\"translit\">Bismillahir Rahmanir Rahim</p>\n<p class=\"terj\"><b>Maksud:</b> Dengan nama Allah Yang Maha Pemurah lagi Maha Mengasihani.</p>\n<h3>Hukum Basmalah</h3>\n<table class=\"tbl\">\n<tr><td>Sunat dibaca ketika memulakan setiap surah</td><td>Sunat</td></tr>\n<tr><td>Wajib dibaca pada awal Surah al-Fatihah</td><td>Wajib</td></tr>\n<tr><td>Tidak dibaca pada awal Surah at-Taubah / Bara'ah</td><td>Tidak dibaca</td></tr>\n</table>\n<h3>Tiga Cara Menggabungkan Basmalah dengan Akhir Surah dan Awal Surah</h3>\n<ol>\n<li>Berhenti pada akhir surah, dan berhenti pada basmalah (kedua-duanya berhenti / waqaf).</li>\n<li>Berhenti pada akhir surah, sambung basmalah dengan awal surah berikutnya.</li>\n<li>Sambung akhir surah dengan basmalah, dan awal surah (semua wasal, tanpa henti).</li>\n</ol>\n<p><i>Nota: Tidak boleh menyambungkan akhir surah terus kepada awal surah baharu tanpa membaca basmalah.</i></p>\n", "questions": [{"q": "Apakah lafaz penuh Basmalah?", "opts": ["Alhamdulillahi Rabbil 'alamin", "Bismillahir Rahmanir Rahim", "Subhanallahi wa bihamdih", "La ilaha illallah"], "correct": 1, "diff": "mudah"}, {"q": "Apakah hukum membaca basmalah pada awal Surah al-Fatihah?", "opts": ["Sunat", "Wajib", "Harus", "Makruh"], "correct": 1, "diff": "sukar"}, {"q": "Surah manakah yang TIDAK dibaca basmalah pada permulaannya?", "opts": ["Al-Baqarah", "Yunus", "At-Taubah", "Al-Ikhlas"], "correct": 2, "diff": "sukar"}, {"q": "Berapakah bilangan cara menggabungkan basmalah antara dua surah?", "opts": ["2", "3", "4", "5"], "correct": 1, "diff": "sukar"}, {"q": "Cara manakah yang menyambungkan akhir surah, basmalah, dan awal surah tanpa henti sama sekali?", "opts": ["Cara pertama", "Cara kedua", "Cara ketiga", "Tiada cara sedemikian"], "correct": 2, "diff": "sukar"}, {"q": "Apakah yang TIDAK dibenarkan semasa membaca basmalah antara dua surah?", "opts": ["Berhenti pada kedua-duanya", "Menyambungkan kesemuanya", "Menyambung akhir surah terus ke awal surah tanpa basmalah", "Berhenti pada akhir surah sahaja"], "correct": 2, "diff": "sukar"}, {"q": "Apakah hukum membaca basmalah pada permulaan surah-surah lain (selain al-Fatihah dan at-Taubah)?", "opts": ["Wajib", "Sunat", "Haram", "Makruh"], "correct": 1, "diff": "mudah"}, {"q": "Basmalah bermaksud memulakan sesuatu dengan menyebut nama...", "opts": ["Rasulullah", "Allah", "Malaikat", "Nabi"], "correct": 1, "diff": "mudah"}, {"q": "Berapakah bilangan kalimah dalam lafaz Basmalah?", "opts": ["3", "4", "5", "6"], "correct": 1, "diff": "mudah"}]}, {"id": 6, "title": "Ahkam Al-Ma'rifah (Al Qamariyah & Syamsiyah)", "notes": "\n<h3>Hukum Lam Ta'rif (ال)</h3>\n<p>Apabila lam ال (alif-lam) bertemu dengan huruf hijaiyah pertama sesuatu perkataan, ia terbahagi kepada dua hukum.</p>\n<h3>1. Izhar Qamariah (Al Qamariah)</h3>\n<p><b>Cara baca:</b> lam ال dibaca jelas / terang, tanpa diidghamkan.</p>\n<p><b>14 huruf Qamariah</b> (rumus: أَبْغِ حَجَّكَ وَخَفْ عَقِيمَهُ):\nء ب غ ح ج ك و خ ف ع ق ي م ه</p>\n<table class=\"tbl\"><tr><td>الْفَوْزُ</td><td>الْأَوَّلُ</td><td>الْقَهَّارُ</td></tr></table>\n<h3>2. Idgham Syamsiah (Al Syamsiah)</h3>\n<p><b>Cara baca:</b> lam ال tidak disebut — digabungkan (diidghamkan) terus dengan huruf selepasnya\nyang bertasydid.</p>\n<p><b>14 huruf Syamsiah:</b>\nت ث د ذ ر ز س ش ص ض ط ظ ل ن</p>\n<table class=\"tbl\"><tr><td>الشَّمْسُ</td><td>التَّهَارِ</td><td>الرَّحْمَٰنِ</td></tr></table>\n<h3>Asal Usul Nama</h3>\n<p>Kedua-dua hukum dinamakan sempena perkataan contoh yang paling terkenal: <b>Al Qamariah</b>\ndiambil daripada perkataan <b>الْقَمَرُ</b> (bulan) kerana huruf ق tergolong huruf Qamariah (lam\ndiizharkan); <b>Al Syamsiah</b> diambil daripada perkataan <b>الشَّمْسُ</b> (matahari) kerana huruf\nش tergolong huruf Syamsiah (lam diidghamkan).</p>\n<h3>Perbandingan Ringkas</h3>\n<table class=\"tbl\">\n<tr><th></th><th>Al Qamariah</th><th>Al Syamsiah</th></tr>\n<tr><td>Cara sebut lam</td><td>Jelas / diizharkan</td><td>Diidghamkan (hilang)</td></tr>\n<tr><td>Tanda dalam mushaf</td><td>Sukun di atas lam</td><td>Tiada sukun, tasydid pada huruf selepas</td></tr>\n<tr><td>Jumlah huruf</td><td>14</td><td>14</td></tr>\n</table>\n", "questions": [{"q": "Apakah d Badal berlaku apabila...", "opts": ["Hamzah mendahului huruf mad", "Huruf mad mendahului hamzah dalam satu perkataan", "Ada tasydid selepas mad", "Berlaku waqaf"], "correct": 0, "diff": "sukar"}, {"q": "Berapakah kadar bacaan Mad Badal?", "opts": ["2 harakat", "4 harakat", "5 harakat", "6 harakat"], "correct": 0, "diff": "sukar"}, {"q": "Perkataan ءَامَنَ pada asalnya adalah gabungan hamzah dan...", "opts": ["Huruf mad selepasnya", "Huruf qalqalah", "Huruf syamsiah", "Tanwin"], "correct": 0, "diff": "sukar"}, {"q": "Mad Silah Kubra melibatkan pertemuan ha dhamir dengan...", "opts": ["Huruf qalqalah", "Hamzah selepasnya", "Huruf mad sahaja", "Huruf syamsiah"], "correct": 1, "diff": "sukar"}, {"q": "ٱلسَّمَآءُ mengandungi Mad jenis...", "opts": ["Mad Badal", "Mad Wajib Muttasil", "Mad Jaiz Munfasil", "Mad Silah Kubra"], "correct": 1, "diff": "mudah"}, {"q": "بِمَآ أَنزَلَ mengandungi Mad jenis...", "opts": ["Mad Wajib Muttasil", "Mad Badal", "Mad Jaiz Munfasil", "Mad Lazim"], "correct": 2, "diff": "sukar"}, {"q": "Antara Mad Wajib Muttasil dan Mad Jaiz Munfasil, yang manakah lebih ketat/wajib hukumnya?", "opts": ["Mad Jaiz Munfasil", "Mad Wajib Muttasil", "Kedua-duanya sama wajib", "Tiada perbezaan"], "correct": 1, "diff": "sukar"}, {"q": "Manakah antara berikut adalah punca / sebab kepada 4 jenis mad dalam topik ini?", "opts": ["Sukun asli", "Hamzah (ء)", "Sukun 'aridh kerana waqaf", "Tasydid"], "correct": 1, "diff": "mudah"}, {"q": "قَوَّٰمِينَ لِلَّهِ شُهَدَآءَ mengandungi contoh Mad...", "opts": ["Wajib Muttasil", "Silah Qasirah", "Tamkin", "Lazim Harfi"], "correct": 0, "diff": "sukar"}, {"q": "Sebab utama bagi kesemua 4 jenis mad dalam topik ini ialah pertemuan huruf mad dengan...", "opts": ["Huruf qalqalah", "Hamzah", "Huruf syamsiah", "Tasydid biasa"], "correct": 1, "diff": "mudah"}]}, {"id": 15, "title": "Mad Far'i - Sebab Sukun 'Aridh (Mendatang)", "notes": "\n<h3>Dua Jenis</h3>\n<table class=\"tbl\">\n<tr><th>Jenis</th><th>Keterangan</th><th>Kadar</th><th>Contoh</th></tr>\n<tr><td>Mad 'Aridh Lissukun</td><td>Huruf mad asli bertemu huruf yang disukunkan sebab waqaf\n(huruf terakhir asalnya berbaris)</td><td>2, 4, atau 6 harakat</td><td>ٱلْعَٰلَمِينَ (waqaf)</td></tr>\n<tr><td>Mad Lin</td><td>Huruf و atau ي bersukun asli, didahului baris atas (fathah),\ndan berlaku waqaf selepasnya</td><td>2, 4, atau 6 harakat</td><td>مِنْ خَوْفٍ (waqaf) &nbsp;|&nbsp; ٱلْبَيْتِ (waqaf)</td></tr>\n</table>\n<h3>Perbezaan Utama</h3>\n<p>Mad 'Aridh Lissukun: huruf sebelum sukun ialah HURUF MAD (ا و ي mengikut baris sepadan).<br/>\nMad Lin: huruf و / ي itu SENDIRI bersukun (bukan huruf mad), didahului fathah.</p>\n", "questions": [{"q": "Mad 'Aridh Lissukun berlaku sebab...", "opts": ["Hamzah", "Waqaf (sukun mendatang) pada akhir perkataan", "Tasydid", "Huruf muqatta'at"], "correct": 1, "diff": "mudah"}, {"q": "Berapakah kadar bacaan Mad 'Aridh Lissukun?", "opts": ["2 harakat sahaja", "2, 4, atau 6 harakat", "4 harakat sahaja", "6 harakat sahaja"], "correct": 1, "diff": "sukar"}, {"q": "Mad Lin melibatkan huruf...", "opts": ["ا dan ي sahaja", "و atau ي bersukun didahului baris atas", "Ha dhamir", "Hamzah"], "correct": 1, "diff": "sukar"}, {"q": "Berapakah kadar bacaan Mad Lin?", "opts": ["2, 4, atau 6 harakat", "Tetap 2 harakat", "Tetap 6 harakat", "1 atau 2 harakat"], "correct": 0, "diff": "sukar"}, {"q": "Mad Lin dan Mad 'Aridh Lissukun kedua-duanya hanya berlaku ketika...", "opts": ["Wasal", "Waqaf (berhenti)", "Permulaan bacaan", "Membaca cepat"], "correct": 1, "diff": "sukar"}, {"q": "مِنْ خَوْفٍ apabila diwaqafkan mengandungi Mad...", "opts": ["'Aridh Lissukun", "Lin", "Badal", "Silah Kubra"], "correct": 1, "diff": "sukar"}, {"q": "ٱلْعَٰلَمِينَ apabila diwaqafkan pada akhir ayat mengandungi Mad...", "opts": ["Lin", "'Aridh Lissukun", "Tamkin", "Muqatta'at"], "correct": 1, "diff": "sukar"}, {"q": "Perbezaan utama Mad Lin berbanding Mad 'Aridh Lissukun ialah...", "opts": ["Huruf و/ي itu sendiri bersukun (bukan huruf mad biasa)", "Ia tidak memerlukan waqaf", "Kadarnya tetap 2 harakat", "Ia berlaku kerana hamzah"], "correct": 0, "diff": "sukar"}, {"q": "Jika bacaan diteruskan (wasal, tiada waqaf), adakah Mad 'Aridh Lissukun berlaku?", "opts": ["Ya, tetap berlaku", "Tidak, ia hanya berlaku semasa waqaf", "Ya tetapi kadar berbeza", "Bergantung kepada surah"], "correct": 1, "diff": "sukar"}, {"q": "Mad Lin dinamakan sedemikian kerana bunyi و / ي bersukun itu...", "opts": ["Lembut / senang disebut", "Sukar disebut", "Panjang secara automatik", "Tidak boleh diwaqafkan"], "correct": 0, "diff": "mudah"}, {"q": "Mad 'Aridh Lissukun dan Mad Lin sama-sama hanya berlaku ketika berlakunya...", "opts": ["Permulaan bacaan", "Waqaf (berhenti)", "Idgham", "Tasydid"], "correct": 1, "diff": "mudah"}]}, {"id": 16, "title": "Mad Far'i - Sebab Sukun Asli (Mad Lazim)", "notes": "\n<h3>Empat Jenis Mad Lazim (Kadar semuanya 6 harakat)</h3>\n<table class=\"tbl\">\n<tr><th>Jenis</th><th>Keterangan</th><th>Contoh</th></tr>\n<tr><td>Mad Lazim Kalimi Muthaqqal</td><td>Huruf mad bertemu huruf bertasydid dalam SATU perkataan</td>\n<td>ٱلْحَآقَّةُ &nbsp;|&nbsp; وَلَا ٱلضَّآلِّينَ</td></tr>\n<tr><td>Mad Lazim Kalimi Mukhaffaf</td><td>Huruf mad bertemu huruf bersukun (tanpa tasydid)\ndalam SATU perkataan</td><td>ءَآلْـَٔـٰنَ</td></tr>\n<tr><td>Mad Lazim Harfi Muthaqqal</td><td>Huruf Muqatta'at (3 huruf ejaan) yang mengandungi\nidgham (bertasydid)</td><td>الٓمٓ (mim &rarr; mim bertasydid)</td></tr>\n<tr><td>Mad Lazim Harfi Mukhaffaf</td><td>Huruf Muqatta'at (3 huruf ejaan) tanpa idgham</td>\n<td>صٓ &nbsp;|&nbsp; نٓ &nbsp;|&nbsp; قٓ</td></tr>\n</table>\n<h3>8 Huruf Muqatta'at yang Berejaan 3 Huruf</h3>\n<p>Rumus: <b>نَقَصَ عَسَلُكُمْ</b> — ن ق ص ع س ل ك م</p>\n<h3>Contoh Terperinci (Analisis Fawatih Suwar)</h3>\n<table class=\"tbl\">\n<tr><td>الٓمٓ</td><td>Alif (Mad Asli 2 h.) + Lam (Mad Lazim Harfi Mukhaffaf 6 h.) +\nMim (bertemu mim, Idgham Mithlain / Lazim Harfi Muthaqqal 6 h.)</td></tr>\n<tr><td>طسٓمٓ</td><td>Tha (Mad Lazim Harfi Mukhaffaf) + Sin (bertemu mim, Idgham Ma'al Ghunnah,\nLazim Harfi Muthaqqal) + Mim</td></tr>\n</table>\n", "questions": [{"q": "Berapakah kadar bacaan bagi kesemua jenis Mad Lazim?", "opts": ["2 harakat", "4 harakat", "6 harakat", "Berbeza-beza"], "correct": 2, "diff": "mudah"}, {"q": "Mad Lazim Kalimi Muthaqqal berlaku apabila huruf mad bertemu huruf...", "opts": ["Bersukun biasa", "Bertasydid dalam satu perkataan", "Hamzah", "Huruf halqi"], "correct": 1, "diff": "sukar"}, {"q": "Mad Lazim Kalimi Mukhaffaf berlaku apabila huruf mad bertemu huruf...", "opts": ["Bertasydid", "Bersukun (tanpa tasydid) dalam satu perkataan", "Hamzah", "Tanwin"], "correct": 1, "diff": "sukar"}, {"q": "Mad Lazim Harfi berlaku pada...", "opts": ["Perkataan biasa", "Huruf Muqatta'at (pembuka surah) berejaan 3 huruf", "Lafaz Allah", "Akhir ayat sahaja"], "correct": 1, "diff": "sukar"}, {"q": "Berapakah bilangan huruf Muqatta'at yang berejaan 3 huruf (membawa Mad Lazim Harfi)?", "opts": ["6", "7", "8", "9"], "correct": 2, "diff": "sukar"}, {"q": "Rumus \"Naqasa 'Asalukum\" digunakan untuk mengingati huruf...", "opts": ["Huruf Qalqalah", "Huruf Muqatta'at bagi Mad Lazim Harfi", "Huruf Ikhfa Haqiqi", "Huruf Idgham Bila Ghunnah"], "correct": 1, "diff": "sukar"}, {"q": "الٓمٓ — huruf mim di sini dibaca dengan Mad Lazim Harfi jenis...", "opts": ["Mukhaffaf", "Muthaqqal (kerana bertemu mim, diidghamkan)", "Kalimi", "Tidak dibaca mad"], "correct": 1, "diff": "sukar"}, {"q": "صٓ (Surah Sad) dibaca dengan hukum...", "opts": ["Mad Lazim Harfi Muthaqqal", "Mad Lazim Harfi Mukhaffaf", "Mad Badal", "Mad Silah"], "correct": 1, "diff": "sukar"}, {"q": "ٱلْحَآقَّةُ mengandungi hukum...", "opts": ["Mad Lazim Kalimi Muthaqqal", "Mad Lazim Kalimi Mukhaffaf", "Mad Badal", "Mad Tamkin"], "correct": 0, "diff": "sukar"}, {"q": "Huruf ل dalam الٓمٓ dibaca dengan Mad Lazim Harfi jenis...", "opts": ["Muthaqqal", "Mukhaffaf (kerana tiada idgham selepasnya)", "Kalimi", "Tidak bermad"], "correct": 1, "diff": "sukar"}, {"q": "Mad Lazim secara umum dinamakan \"lazim\" kerana ia...", "opts": ["Boleh dipendekkan mengikut suka hati", "Wajib dibaca 6 harakat tanpa pengecualian dalam keadaan asal", "Hanya berlaku semasa waqaf", "Hanya berlaku pada Lafz al-Jalalah"], "correct": 1, "diff": "sukar"}, {"q": "Manakah antara berikut adalah contoh Mad Lazim Kalimi Mukhaffaf?", "opts": ["ءَآلْـَٔـٰنَ", "الٓمٓ", "قُلْ هُوَ ٱللَّهُ", "بِمَآ أَنزَلَ"], "correct": 0, "diff": "sukar"}]}, {"id": 17, "title": "Jenis-Jenis Idgham (Rangka Umum)", "notes": "\n<h3>Definisi Idgham</h3>\n<table class=\"tbl\"><tr><th>Bahasa</th><td>Memasukkan sesuatu ke dalam sesuatu yang lain</td></tr>\n<tr><th>Istilah</th><td>Menggabungkan dua huruf yang bertemu (huruf pertama bersukun,\nhuruf kedua berbaris) menjadi satu huruf bertasydid</td></tr></table>\n<h3>Tiga Jenis Idgham (di luar konteks Nun Sakinah/Mim Sakinah)</h3>\n<table class=\"tbl\">\n<tr><th>Jenis</th><th>Syarat</th></tr>\n<tr><td>Idgham Mutamathilain</td><td>Dua huruf SAMA makhraj dan SAMA sifat</td></tr>\n<tr><td>Idgham Mutaqaribain</td><td>Dua huruf HAMPIR makhraj, sifat berbeza atau hampir</td></tr>\n<tr><td>Idgham Mutajanisain</td><td>Dua huruf SAMA makhraj tetapi BERBEZA sifat</td></tr>\n</table>\n", "questions": [{"q": "Apakah maksud idgham dari sudut bahasa?", "opts": ["Memisahkan dua huruf", "Memasukkan sesuatu ke dalam sesuatu yang lain", "Menebalkan bacaan", "Memanjangkan bacaan"], "correct": 1, "diff": "mudah"}, {"q": "Berapakah bilangan jenis idgham (selain konteks nun/mim sakinah) yang dipelajari?", "opts": ["2", "3", "4", "5"], "correct": 1, "diff": "mudah"}, {"q": "Idgham Mutamathilain berlaku antara dua huruf yang...", "opts": ["Sama makhraj dan sama sifat", "Hampir makhraj sahaja", "Sama makhraj tetapi beza sifat", "Tiada kaitan makhraj"], "correct": 0, "diff": "sukar"}, {"q": "Idgham Mutaqaribain berlaku antara dua huruf yang...", "opts": ["Sama makhraj dan sifat", "Hampir makhraj dan/atau sifat", "Jauh sama sekali makhrajnya", "Kedua-duanya huruf mad"], "correct": 1, "diff": "sukar"}, {"q": "Idgham Mutajanisain berlaku antara dua huruf yang...", "opts": ["Sama makhraj tetapi berbeza sifat", "Sama sifat tetapi berbeza makhraj", "Tiada persamaan langsung", "Kedua-duanya huruf qalqalah"], "correct": 0, "diff": "sukar"}, {"q": "Dalam idgham, huruf pertama mestilah dalam keadaan...", "opts": ["Berbaris atas", "Bersukun", "Bertasydid", "Bertanwin"], "correct": 1, "diff": "sukar"}, {"q": "Huruf pertama dalam mana-mana jenis idgham mestilah dalam keadaan...", "opts": ["Berbaris", "Bersukun", "Bertanwin", "Bermad"], "correct": 1, "diff": "mudah"}, {"q": "Hasil idgham ialah dua huruf digabung menjadi satu huruf...", "opts": ["Bersukun", "Bertasydid", "Bertanwin", "Berbaris bawah"], "correct": 1, "diff": "mudah"}, {"q": "Idgham secara umum berbeza daripada Izhar kerana dalam Idgham, huruf pertama...", "opts": ["Dibaca jelas berasingan", "Digabungkan dan hilang sebutannya ke dalam huruf kedua", "Dipanjangkan 6 harakat", "Ditukar bunyi sepenuhnya"], "correct": 1, "diff": "mudah"}]}, {"id": 18, "title": "Idgham Mutamathilain", "notes": "\n<h3>Definisi</h3>\n<p>Dua huruf yang <b>sama makhraj dan sama sifat</b> bertemu; huruf pertama bersukun, huruf kedua\nberbaris. Kedua-duanya digabungkan menjadi satu huruf bertasydid.</p>\n<h3>Contoh</h3>\n<table class=\"tbl\">\n<tr><td>يُوَجِّهْهُ</td><td>ه + ه</td></tr>\n<tr><td>فَقُلْنَا ٱضْرِب بِّعَصَاكَ</td><td>ب + ب</td></tr>\n<tr><td>قُل لَّكُم</td><td>ل + ل</td></tr>\n<tr><td>وَقَد دَّخَلُوا۟</td><td>د + د</td></tr>\n</table>\n<p><i>Nota: Idgham Ma'al Ghunnah dan Idgham Syafawi (dalam topik nun/mim sakinah) juga\ntergolong contoh mutamathilain, tetapi dibahaskan berasingan sebagai hukum khusus.</i></p>\n", "questions": [{"q": "Idgham Mutamathilain berlaku apabila dua huruf yang bertemu adalah...", "opts": ["Sama makhraj dan sifat", "Berbeza makhraj dan sifat", "Hampir makhraj sahaja", "Salah satunya huruf mad"], "correct": 0, "diff": "mudah"}, {"q": "Perkataan يُوَجِّهْهُ mengandungi Idgham Mutamathilain antara huruf...", "opts": ["ب dan ب", "ه dan ه", "ل dan ل", "د dan د"], "correct": 1, "diff": "sukar"}, {"q": "Perkataan قُل لَّكُم mengandungi Idgham Mutamathilain antara huruf...", "opts": ["ل dan ل", "ب dan ب", "م dan م", "ت dan ت"], "correct": 0, "diff": "sukar"}, {"q": "Syarat wajib bagi Idgham Mutamathilain ialah huruf pertama mestilah...", "opts": ["Berbaris atas", "Bersukun", "Bertanwin", "Huruf qalqalah"], "correct": 1, "diff": "sukar"}, {"q": "فَقُلْنَا ٱضْرِب بِّعَصَاكَ mengandungi pertemuan dua huruf...", "opts": ["د dan د", "ب dan ب", "ت dan ت", "ن dan ن"], "correct": 1, "diff": "sukar"}, {"q": "Hasil daripada Idgham Mutamathilain, dua huruf yang serupa itu disebut sebagai satu huruf...", "opts": ["Bersukun", "Bertasydid", "Bertanwin", "Berbaris bawah"], "correct": 1, "diff": "mudah"}, {"q": "\"Mutamathilain\" berasal daripada kata dasar yang bermaksud...", "opts": ["Berbeza", "Serupa / sama", "Hampir", "Bertentangan"], "correct": 1, "diff": "mudah"}, {"q": "Idgham Mutamathilain digabungkan menjadi satu huruf yang...", "opts": ["Bersukun", "Bertasydid", "Bertanwin", "Bermad"], "correct": 1, "diff": "mudah"}, {"q": "Dalam Idgham Mutamathilain, jika huruf pertama dan kedua adalah dua huruf ba (ب), hukum ini dinamakan idgham...", "opts": ["Mutaqaribain", "Mutajanisain", "Mutamathilain (huruf serupa)", "Bukan idgham"], "correct": 2, "diff": "sukar"}]}, {"id": 19, "title": "Idgham Mutaqaribain", "notes": "\n<h3>Definisi</h3>\n<p>Dua huruf yang <b>hampir makhraj</b> (dan sifatnya berlainan atau hampir) bertemu, digabungkan\nmenjadi satu bunyi.</p>\n<h3>Dua Pasangan Utama</h3>\n<table class=\"tbl\">\n<tr><th>Pasangan</th><th>Sebab Hampir</th><th>Contoh</th></tr>\n<tr><td>ل + ر</td><td>Hampir makhraj dan sifat</td><td>بَل رَّفَعَهُ &nbsp;|&nbsp; قُل رَّبِّي</td></tr>\n<tr><td>ق + ك</td><td>Hampir makhraj (pangkal lidah), sifat berlainan (qalqalah &amp; jahar\nlawan tiada qalqalah)</td><td>أَلَمْ نَخْلُقكُّم</td></tr>\n</table>\n", "questions": [{"q": "Idgham Mutaqaribain berlaku antara huruf yang...", "opts": ["Sama makhraj dan sifat", "Hampir makhraj", "Kedua-duanya huruf mad", "Kedua-duanya huruf ikhfa"], "correct": 1, "diff": "mudah"}, {"q": "Manakah dua pasangan huruf utama bagi Idgham Mutaqaribain?", "opts": ["ب م dan ت د", "ل ر dan ق ك", "س ش dan ح ع", "ن م dan ي و"], "correct": 1, "diff": "sukar"}, {"q": "بَل رَّفَعَهُ mengandungi Idgham Mutaqaribain antara huruf...", "opts": ["ل dan ر", "ق dan ك", "ب dan م", "ت dan د"], "correct": 0, "diff": "sukar"}, {"q": "أَلَمْ نَخْلُقكُّم mengandungi Idgham Mutaqaribain antara huruf...", "opts": ["ل dan ر", "ق dan ك", "ن dan م", "س dan ش"], "correct": 1, "diff": "sukar"}, {"q": "Huruf ل dan ر hampir makhraj kerana kedua-duanya keluar berhampiran...", "opts": ["Dua bibir", "Hujung lidah dekat gusi", "Pangkal lidah", "Rongga hidung"], "correct": 1, "diff": "sukar"}, {"q": "\"Mutaqaribain\" bermaksud dua huruf yang...", "opts": ["Sama sepenuhnya", "Hampir / berdekatan", "Jauh berbeza", "Bertentangan penuh"], "correct": 1, "diff": "mudah"}, {"q": "Idgham Mutaqaribain melibatkan huruf yang keluar dari makhraj yang...", "opts": ["Sama tepat", "Berhampiran", "Jauh berbeza", "Tidak berkaitan"], "correct": 1, "diff": "mudah"}, {"q": "Pasangan ق dan ك dalam Idgham Mutaqaribain sama-sama keluar berhampiran...", "opts": ["Dua bibir", "Pangkal lidah", "Hujung lidah", "Rongga hidung"], "correct": 1, "diff": "mudah"}, {"q": "Idgham Mutaqaribain tidak berlaku pada sebarang dua huruf yang hampir makhraj; ia hanya terhad kepada...", "opts": ["Pasangan huruf yang ditetapkan sahaja (seperti l-r dan q-k)", "Semua huruf halqi", "Semua huruf qalqalah", "Huruf-huruf mad"], "correct": 0, "diff": "sukar"}]}, {"id": 20, "title": "Idgham Mutajanisain", "notes": "\n<h3>Definisi</h3>\n<p>Dua huruf yang <b>sama makhraj tetapi berbeza sifat</b> bertemu, digabungkan menjadi satu huruf.\nIni berbeza daripada Idgham Mutamathilain (Topik 18) yang melibatkan dua huruf <b>serupa</b>\n(sama makhraj DAN sama sifat).</p>\n<h3>Pasangan-Pasangan Utama</h3>\n<table class=\"tbl\">\n<tr><th>Kumpulan Makhraj</th><th>Pasangan Huruf</th><th>Contoh</th></tr>\n<tr><td>Hujung lidah / gigi (kumpulan ث ذ ظ)</td><td>ث + ذ &nbsp;|&nbsp; ذ + ظ</td>\n<td>يَلْهَث ذَّٰلِكَ &nbsp;|&nbsp; إِذ ظَّلَمْتُم</td></tr>\n<tr><td>Dua bibir</td><td>ب + م</td><td>يَٰبُنَيَّ ٱرْكَب مَّعَنَا</td></tr>\n<tr><td>Hujung lidah / gusi (kumpulan ت د ط)</td><td>د + ت &nbsp;|&nbsp; ت + د &nbsp;|&nbsp;\nت + ط &nbsp;|&nbsp; ط + ت</td>\n<td>قَد تَّبَيَّنَ &nbsp;|&nbsp; قَدْ أُجِيبَت دَّعْوَتُكُمَا &nbsp;|&nbsp; وَدَّت طَّآئِفَةٌ &nbsp;|&nbsp;\nأَحَطتُ</td></tr>\n</table>\n", "questions": [{"q": "Idgham Mutajanisain berlaku antara huruf yang...", "opts": ["Sama makhraj, sama sifat", "Sama makhraj, berbeza sifat", "Berbeza makhraj sepenuhnya", "Kedua-duanya huruf mad"], "correct": 1, "diff": "mudah"}, {"q": "Manakah pasangan huruf bagi Idgham Mutajanisain daripada kumpulan dua bibir?", "opts": ["ل dan ر", "ب dan م", "ق dan ك", "ث dan ذ"], "correct": 1, "diff": "sukar"}, {"q": "يَلْهَث ذَّٰلِكَ mengandungi Idgham Mutajanisain antara huruf...", "opts": ["ب dan م", "ث dan ذ", "ت dan د", "ط dan ت"], "correct": 1, "diff": "sukar"}, {"q": "قَد تَّبَيَّنَ mengandungi Idgham Mutajanisain antara huruf...", "opts": ["د dan ت", "ب dan م", "ث dan ذ", "ق dan ك"], "correct": 0, "diff": "sukar"}, {"q": "Huruf ت د ط dikatakan sama makhraj kerana ketiga-tiganya keluar daripada...", "opts": ["Dua bibir", "Hujung lidah bertemu gusi/gigi atas", "Pangkal lidah", "Rongga hidung"], "correct": 1, "diff": "sukar"}, {"q": "يَٰبُنَيَّ ٱرْكَب مَّعَنَا mengandungi pertemuan huruf...", "opts": ["ب dan م", "ت dan د", "ث dan ذ", "ط dan ت"], "correct": 0, "diff": "sukar"}, {"q": "وَدَّت طَّآئِفَةٌ mengandungi Idgham Mutajanisain antara huruf...", "opts": ["ت dan ط", "د dan ت", "ب dan م", "ذ dan ظ"], "correct": 0, "diff": "sukar"}, {"q": "Berapakah bilangan pasangan huruf utama yang dipelajari dalam Idgham Mutajanisain?", "opts": ["2", "3", "4", "5"], "correct": 1, "diff": "sukar"}, {"q": "Perbezaan utama antara Mutajanisain dan Mutamathilain ialah...", "opts": ["Mutajanisain: sifat berbeza; Mutamathilain: sifat sama", "Kedua-duanya sama sahaja", "Mutajanisain tiada dalam al-Quran", "Mutamathilain hanya untuk huruf mad"], "correct": 0, "diff": "sukar"}, {"q": "إِذ ظَّلَمْتُم mengandungi Idgham Mutajanisain antara huruf...", "opts": ["ذ dan ظ", "ت dan د", "ب dan م", "ق dan ك"], "correct": 0, "diff": "sukar"}, {"q": "Idgham Mutajanisain melibatkan huruf yang sama pada segi...", "opts": ["Sifat sahaja", "Makhraj", "Bilangan titik", "Warna tulisan"], "correct": 1, "diff": "mudah"}]}, {"id": 21, "title": "Hukum Ra (ر)", "notes": "\n<h3>Tiga Hukum Bacaan Ra</h3>\n<table class=\"tbl\"><tr><th>Hukum</th><th>Maksud</th></tr>\n<tr><td>Tafkhim</td><td>Dibaca tebal</td></tr><tr><td>Tarqiq</td><td>Dibaca nipis</td></tr>\n<tr><td>Harus Tafkhim atau Tarqiq</td><td>Boleh dibaca kedua-duanya</td></tr></table>\n<h3>Ra Tafkhim — 6 Keadaan</h3>\n<ol>\n<li>Ra berbaris atas (fathah) atau depan (dammah): رَبَّكَ &nbsp;|&nbsp; كَفَرُوا۟</li>\n<li>Ra sakinah didahului baris atas/depan: ٱلْأَرْضِ &nbsp;|&nbsp; مَرْيَمَ</li>\n<li>Ra diwaqafkan, didahului huruf mad (ا/و) yang didahului fathah/dammah: مِنْهُ ٱلْأَنْهَٰرُ</li>\n<li>Ra diwaqafkan, didahului sukun (mati), huruf sebelum sukun berbaris atas/depan: ٱلْفَجْرِ &nbsp;\n(pengecualian — lihat harus wajah di bawah)</li>\n<li>Ra sakinah didahului hamzah wasal berbaris kasrah: ٱرْجِعِى</li>\n</ol>\n<h3>Ra Tarqiq — 4 Keadaan</h3>\n<ol>\n<li>Ra berbaris bawah (kasrah): فَرِيقٌ</li>\n<li>Ra sakinah didahului baris bawah: فِرْعَوْنَ</li>\n<li>Ra sakinah didahului huruf mad/lin ي: بَصِيرٌ</li>\n<li>Ra diwaqafkan, sukun didahului huruf bukan isti'la, didahului kasrah: ٱلسِّحْرَ</li>\n</ol>\n<h3>Harus Wajhain (Boleh Tebal atau Nipis)</h3>\n<p>Berlaku pada ra bersukun kerana waqaf, didahului huruf isti'la (خص ضغط قظ) yang bersukun,\nsedang huruf sebelumnya berbaris bawah — contoh: قِطْر &nbsp;|&nbsp; فِرْق</p>\n", "questions": [{"q": "Berapakah bilangan hukum bacaan bagi huruf ra?", "opts": ["2", "3", "4", "5"], "correct": 1, "diff": "mudah"}, {"q": "Ra dibaca Tafkhim apabila ra berbaris...", "opts": ["Bawah (kasrah)", "Atas atau depan (fathah/dammah)", "Sukun sahaja", "Tanwin bawah"], "correct": 1, "diff": "mudah"}, {"q": "Ra dibaca Tarqiq apabila ra berbaris...", "opts": ["Atas", "Depan", "Bawah (kasrah)", "Sukun"], "correct": 2, "diff": "mudah"}, {"q": "فَرِيقٌ — bagaimanakah ra pada perkataan ini dibaca?", "opts": ["Tafkhim", "Tarqiq", "Harus dua wajah", "Idgham"], "correct": 1, "diff": "sukar"}, {"q": "رَبَّكَ — bagaimanakah ra dibaca di sini?", "opts": ["Tarqiq", "Tafkhim", "Harus dua wajah", "Ikhfa"], "correct": 1, "diff": "mudah"}, {"q": "Ra sakinah dibaca Tarqiq apabila didahului huruf mad/lin...", "opts": ["ا", "و", "ي", "Semua huruf mad"], "correct": 2, "diff": "sukar"}, {"q": "بَصِيرٌ — ra pada perkataan ini dibaca Tarqiq kerana didahului...", "opts": ["Kasrah terus", "Huruf mad ي", "Huruf mad و", "Sukun"], "correct": 1, "diff": "sukar"}, {"q": "Berapakah bilangan keadaan yang menyebabkan Ra dibaca Tafkhim?", "opts": ["4", "5", "6", "7"], "correct": 2, "diff": "sukar"}, {"q": "Berapakah bilangan keadaan yang menyebabkan Ra dibaca Tarqiq?", "opts": ["3", "4", "5", "6"], "correct": 1, "diff": "sukar"}, {"q": "\"Harus Tafkhim atau Tarqiq\" pada ra berlaku dalam keadaan...", "opts": ["Ra berbaris atas biasa", "Ra bersukun kerana waqaf, didahului huruf isti'la bersukun yang didahului kasrah", "Ra di permulaan ayat", "Ra bertasydid"], "correct": 1, "diff": "sukar"}, {"q": "قِطْر merupakan contoh bagi hukum ra...", "opts": ["Tafkhim mutlak", "Tarqiq mutlak", "Harus dua wajah (Tafkhim atau Tarqiq)", "Idgham"], "correct": 2, "diff": "sukar"}, {"q": "ٱلْأَرْضِ — ra pada perkataan ini dibaca Tafkhim kerana ra sakinah didahului...", "opts": ["Baris bawah", "Baris atas atau depan", "Huruf mad ي", "Hamzah wasal berkasrah"], "correct": 1, "diff": "sukar"}, {"q": "Huruf-huruf isti'la yang relevan dalam kes \"harus wajhain\" bagi ra ialah (rumus)...", "opts": ["أَغْجٍ خَعَه", "خص ضغط قظ", "قُطْبُ جَدٍّ", "نَقَصَ عَسَلُكُمْ"], "correct": 1, "diff": "sukar"}, {"q": "ٱرْجِعِى — ra sakinah di sini dibaca Tafkhim kerana didahului...", "opts": ["Hamzah wasal berbaris kasrah", "Huruf mad", "Baris bawah terus", "Huruf isti'la"], "correct": 0, "diff": "sukar"}, {"q": "Secara umum, ra dibaca tebal (tafkhim) apabila ada kaitan dengan baris...", "opts": ["Kasrah (bawah)", "Fathah/Dammah (atas/depan)", "Sukun sahaja tanpa syarat lain", "Tanwin bawah"], "correct": 1, "diff": "mudah"}]}, {"id": 22, "title": "Hamzah Wasal dan Qat'", "notes": "\n<h3>Dua Jenis Hamzah</h3>\n<table class=\"tbl\"><tr><th>Jenis</th><th>Ciri</th></tr>\n<tr><td>Hamzah Wasal (ٱ)</td><td>Hanya disebut pada permulaan bacaan; hilang bunyi apabila\ndisambung (wasal) dengan perkataan sebelumnya</td></tr>\n<tr><td>Hamzah Qat' (أ / إ)</td><td>Sentiasa disebut sama ada di awal, tengah, atau akhir\nperkataan — tidak pernah gugur bunyinya</td></tr></table>\n<h3>Keadaan Hamzah Wasal</h3>\n<ol>\n<li><b>Pada ال (lam ta'rif)</b> — dibaca fathah: ٱلشَّجَرَةَ</li>\n<li><b>Pada kata kerja (fi'il)</b> — dibaca kasrah, ATAU dammah jika huruf ketiga\nasalnya berbaris dammah: ٱرْحَمْنَا (kasrah) &nbsp;|&nbsp; ٱدْعُوا۟ (dammah)</li>\n<li><b>Pada kata nama (isim) khusus</b> — dibaca kasrah: ٱبْنَة &nbsp;|&nbsp;\nٱمْرَأَت &nbsp;|&nbsp; ٱثْنَيْنِ &nbsp;|&nbsp; ٱبْن</li>\n</ol>\n<h3>Hamzah Qat'</h3>\n<p>Boleh berlaku di awal kalimah (أَمَرَ), di tengah kalimah (يَأْتِيهِ), atau di akhir kalimah\n(جَآءَ) — sentiasa dibaca/disebut.</p>\n<h3>Tanda dalam Mushaf</h3>\n<p>Hamzah Wasal ditulis sebagai alif dengan kepala kecil bulat di atasnya (ٱ), berbeza daripada\nHamzah Qat' yang ditulis dengan tanda hamzah penuh (ء) di atas atau bawah alif (أ / إ).</p>\n", "questions": [{"q": "Apakah perbezaan utama antara Hamzah Wasal dan Hamzah Qat'?", "opts": ["Wasal sentiasa disebut, Qat' kadang hilang", "Wasal hilang bunyi bila disambung, Qat' sentiasa disebut", "Kedua-duanya sama sahaja", "Qat' hanya pada lafaz Allah"], "correct": 1, "diff": "mudah"}, {"q": "Hamzah Wasal pada ال (lam ta'rif) dibaca dengan baris...", "opts": ["Kasrah", "Fathah", "Dammah", "Sukun"], "correct": 1, "diff": "sukar"}, {"q": "Hamzah Wasal pada kebanyakan fi'il (kata kerja) dibaca dengan baris...", "opts": ["Fathah", "Kasrah", "Dammah", "Tanwin"], "correct": 1, "diff": "sukar"}, {"q": "Bilakah Hamzah Wasal pada fi'il dibaca dengan dammah?", "opts": ["Apabila huruf ketiga asal perkataan berbaris dammah", "Apabila ia kata nama", "Apabila ia di akhir ayat", "Tidak pernah dibaca dammah"], "correct": 0, "diff": "sukar"}, {"q": "Manakah antara berikut adalah kata nama (isim) khusus yang Hamzah Wasalnya dibaca kasrah?", "opts": ["ٱلشَّمْسُ", "ٱبْنَة، ٱمْرَأَت، ٱثْنَيْنِ، ٱبْن", "ٱدْعُوا۟", "ٱقْضِ"], "correct": 1, "diff": "sukar"}, {"q": "Hamzah Qat' boleh berlaku pada kedudukan...", "opts": ["Awal kalimah sahaja", "Awal, tengah, atau akhir kalimah", "Akhir kalimah sahaja", "Hanya selepas waqaf"], "correct": 1, "diff": "mudah"}, {"q": "جَآءَ mengandungi Hamzah Qat' pada kedudukan...", "opts": ["Awal kalimah", "Tengah kalimah", "Akhir kalimah", "Tiada hamzah qat'"], "correct": 2, "diff": "sukar"}, {"q": "Hamzah Wasal ditandakan dalam rasm Uthmani dengan simbol...", "opts": ["Hamzah biasa (ء)", "ٱ (kepala shod / bulatan kecil di atas alif)", "Tiada tanda khas", "Tasydid"], "correct": 1, "diff": "sukar"}, {"q": "Hamzah yang hilang bunyinya apabila disambung dengan perkataan sebelumnya dipanggil...", "opts": ["Hamzah Qat'", "Hamzah Wasal", "Hamzah Munfasil", "Hamzah Muttasil"], "correct": 1, "diff": "mudah"}]}, {"id": 23, "title": "Bacaan Khas Riwayat Hafs 'an 'Asim", "notes": "\n<h3>Enam Bacaan Khas</h3>\n<table class=\"tbl\">\n<tr><th>Bacaan</th><th>Maksud</th><th>Lokasi (contoh)</th></tr>\n<tr><td>Sakta</td><td>Berhenti seketika tanpa bernafas, tanpa memutuskan niat sambung</td>\n<td>4 tempat WAJIB: al-Kahf:1, al-Qiyamah:27, Ya-Sin:52, al-Mutaffifin:14</td></tr>\n<tr><td>Imalah</td><td>Menyebut baris fathah condong ke arah kasrah</td><td>Hud:41 (مَجْر۪يهَا)</td></tr>\n<tr><td>Naql</td><td>Memindahkan baris hamzah kepada huruf mati sebelumnya</td>\n<td>al-Hujurat:11 (بِئْسَ ٱلِٱسْمُ)</td></tr>\n<tr><td>Tashil</td><td>Memudahkan sebutan hamzah kedua (antara hamzah &amp; alif)</td>\n<td>Fussilat:44 (ءَاَعْجَمِيٌّ)</td></tr>\n<tr><td>Isymam</td><td>Memoncongkan bibir seperti baris dammah tanpa bersuara ketika\nmengidghamkan nun</td><td>Yusuf:11 (لَا تَأْمَ۫نَّا)</td></tr>\n<tr><td>Rum</td><td>Menyebut sebahagian kecil sahaja baris huruf akhir ketika waqaf</td>\n<td>al-Fajr:2, al-'Asr:1</td></tr>\n</table>\n<h3>Nota</h3>\n<p>Kesemua enam bacaan khas ini adalah bacaan istimewa yang hanya berlaku pada tempat-tempat\ntertentu sahaja mengikut riwayat Hafs daripada Imam 'Asim.</p>\n", "questions": [{"q": "Berapakah bilangan bacaan khas dalam riwayat Hafs 'an 'Asim yang dipelajari?", "opts": ["4", "5", "6", "7"], "correct": 2, "diff": "mudah"}, {"q": "Sakta bermaksud...", "opts": ["Berhenti lama dengan bernafas", "Berhenti seketika tanpa bernafas dan tanpa putus niat sambung", "Membaca dengan suara kuat", "Memanjangkan bacaan"], "correct": 1, "diff": "sukar"}, {"q": "Berapakah bilangan tempat wajib Sakta dalam al-Quran?", "opts": ["2", "3", "4", "5"], "correct": 2, "diff": "sukar"}, {"q": "Manakah antara berikut BUKAN salah satu daripada 4 tempat wajib Sakta?", "opts": ["Al-Kahf ayat 1", "Al-Qiyamah ayat 27", "Ya-Sin ayat 52", "Al-Fatihah ayat 1"], "correct": 3, "diff": "sukar"}, {"q": "Imalah bermaksud menyebut baris fathah condong ke arah...", "opts": ["Dammah", "Kasrah", "Sukun", "Tanwin"], "correct": 1, "diff": "sukar"}, {"q": "Naql bermaksud...", "opts": ["Memindahkan baris hamzah kepada huruf mati sebelumnya", "Memanjangkan bacaan 6 harakat", "Menghilangkan bunyi huruf terus", "Menukar bunyi ra"], "correct": 0, "diff": "sukar"}, {"q": "Tashil bermaksud memudahkan sebutan...", "opts": ["Ra", "Hamzah kedua (antara hamzah dan alif)", "Nun sakinah", "Mim sakinah"], "correct": 1, "diff": "sukar"}, {"q": "Isymam berlaku dengan cara...", "opts": ["Memoncongkan bibir seperti dammah tanpa bersuara semasa idgham", "Membuka mulut luas", "Menutup mulut rapat", "Menggetarkan lidah"], "correct": 0, "diff": "sukar"}, {"q": "Rum bermaksud...", "opts": ["Menyebut sebahagian kecil sahaja baris huruf akhir ketika waqaf", "Membaca dengan suara penuh", "Mengulang bacaan dua kali", "Memanjangkan mad 6 harakat"], "correct": 0, "diff": "sukar"}, {"q": "Imalah dalam riwayat Hafs berlaku pada satu tempat sahaja iaitu dalam surah...", "opts": ["Yusuf", "Hud", "Al-Fatihah", "Al-Baqarah"], "correct": 1, "diff": "sukar"}, {"q": "Naql berlaku dalam surah...", "opts": ["Al-Hujurat", "Yusuf", "Fussilat", "Al-Fajr"], "correct": 0, "diff": "sukar"}, {"q": "Tashil berlaku dalam surah...", "opts": ["Al-Hujurat", "Fussilat", "Yusuf", "Al-'Asr"], "correct": 1, "diff": "sukar"}, {"q": "Bacaan-bacaan khas seperti Sakta, Imalah dan Naql hanya terpakai pada...", "opts": ["Semua ayat al-Quran", "Tempat-tempat tertentu sahaja mengikut riwayat Hafs", "Surah Makkiyah sahaja", "Surah Madaniyah sahaja"], "correct": 1, "diff": "mudah"}]}, {"id": 24, "title": "Waqf (Tanda Berhenti)", "notes": "\n<h3>Definisi</h3>\n<table class=\"tbl\"><tr><th>Bahasa</th><td>Menahan atau berhenti</td></tr>\n<tr><th>Istilah</th><td>Memutuskan bacaan pada akhir kalimah atau ayat yang bertepatan\ndengan maksud, bagi mengambil nafas semula sebelum menyambung bacaan</td></tr></table>\n<h3>Tujuh Jenis Waqf</h3>\n<table class=\"tbl\">\n<tr><th>Jenis</th><th>Tanda</th><th>Maksud</th></tr>\n<tr><td>Waqf Lazim</td><td>م</td><td>Wajib berhenti</td></tr>\n<tr><td>Waqf Tam</td><td>قلى / ۘ</td><td>Berhenti sempurna, makna lengkap, tiada kaitan ayat\nselepasnya</td></tr>\n<tr><td>Waqf Kafi</td><td>قلى</td><td>Memadai berhenti; makna sempurna tetapi ada kaitan lafaz\ndengan ayat selepas</td></tr>\n<tr><td>Waqf Hasan</td><td>صلى</td><td>Baik berhenti; makna sempurna tetapi bacaan boleh\ndisambung, lebih dituntut sambung</td></tr>\n<tr><td>Waqf Qabih</td><td>لا</td><td>Buruk berhenti; makna tidak sempurna — TIDAK\ndigalakkan berhenti</td></tr>\n<tr><td>Waqf Ja'iz</td><td>ج</td><td>Harus berhenti atau sambung, kedua-duanya sama makbul</td></tr>\n<tr><td>Waqf Ta'anuq</td><td>∴ ∴ (dua tanda sama, muallaqatain)</td><td>Berhenti pada SALAH SATU\nsahaja daripada dua tempat berkenaan, bukan kedua-duanya</td></tr>\n</table>\n<h3>Contoh Waqf Tam</h3>\n<p>Penghujung ayat yang maknanya lengkap dengan sendirinya dan tiada kaitan dengan ayat\nselepasnya, seperti akhir Surah al-Ikhlas: <b>قُلْ هُوَ ٱللَّهُ أَحَدٌ</b> &mdash; ayat ini selesai\nmaknanya, walaupun ayat seterusnya meneruskan topik yang sama.</p>\n", "questions": [{"q": "Apakah maksud waqf dari sudut bahasa?", "opts": ["Menyambung", "Menahan atau berhenti", "Mempercepatkan", "Mendengung"], "correct": 1, "diff": "mudah"}, {"q": "Berapakah bilangan jenis waqf yang dipelajari?", "opts": ["5", "6", "7", "8"], "correct": 2, "diff": "mudah"}, {"q": "Tanda م dalam mushaf menandakan waqf jenis...", "opts": ["Waqf Ja'iz", "Waqf Lazim (wajib berhenti)", "Waqf Qabih", "Waqf Ta'anuq"], "correct": 1, "diff": "sukar"}, {"q": "Waqf Tam bermaksud berhenti dengan keadaan makna...", "opts": ["Tidak sempurna", "Sempurna dan tiada kaitan dengan ayat selepasnya", "Sempurna tetapi ada kaitan lafaz", "Tergantung"], "correct": 1, "diff": "sukar"}, {"q": "Tanda لا dalam mushaf menandakan waqf jenis...", "opts": ["Waqf Hasan", "Waqf Kafi", "Waqf Qabih (tidak digalakkan berhenti)", "Waqf Lazim"], "correct": 2, "diff": "sukar"}, {"q": "Waqf Kafi berbeza daripada Waqf Tam kerana Waqf Kafi...", "opts": ["Maknanya tidak sempurna", "Maknanya sempurna tetapi ada kaitan lafaz dengan ayat selepas", "Wajib berhenti", "Tidak boleh berhenti langsung"], "correct": 1, "diff": "sukar"}, {"q": "Tanda ج menandakan waqf jenis...", "opts": ["Waqf Lazim", "Waqf Ja'iz (harus berhenti atau sambung)", "Waqf Qabih", "Waqf Tam"], "correct": 1, "diff": "sukar"}, {"q": "Waqf Ta'anuq (mu'anaqah) menghendaki pembaca berhenti pada...", "opts": ["Kedua-dua tempat serentak", "Salah satu sahaja daripada dua tempat yang bertanda", "Tiada tempat langsung", "Hujung ayat sahaja"], "correct": 1, "diff": "sukar"}, {"q": "Waqf Hasan ditandakan dengan simbol...", "opts": ["قلى", "صلى", "لا", "∴"], "correct": 1, "diff": "sukar"}, {"q": "Mengapakah Waqf Qabih dikatakan \"buruk\"?", "opts": ["Kerana ia mengubah/mengelirukan makna ayat", "Kerana ia wajib dilakukan", "Kerana ia jarang berlaku", "Kerana ia hanya pada akhir surah"], "correct": 0, "diff": "sukar"}, {"q": "Jenis waqf manakah yang PALING dituntut untuk berhenti berbanding menyambung?", "opts": ["Waqf Ja'iz", "Waqf Qabih", "Waqf Lazim", "Waqf Ta'anuq"], "correct": 2, "diff": "sukar"}, {"q": "Contoh Waqf Lazim boleh dilihat pada ayat...", "opts": ["وَلَا يَحْزُنكَ قَوْلُهُمْ ۘ إِنَّ ٱلْعِزَّةَ لِلَّهِ جَمِيعًا", "Semua ayat al-Quran", "Hanya akhir surah", "Hanya ayat sajdah"], "correct": 0, "diff": "sukar"}, {"q": "Waqf Ja'iz bermaksud pembaca...", "opts": ["Wajib berhenti", "Wajib menyambung", "Harus memilih untuk berhenti atau menyambung", "Dilarang berhenti"], "correct": 2, "diff": "mudah"}, {"q": "Simbol ∴ ∴ (dua titik tiga berpasangan) yang muncul dua kali berturutan menandakan waqf...", "opts": ["Lazim", "Ta'anuq", "Tam", "Kafi"], "correct": 1, "diff": "sukar"}, {"q": "Surah al-Ikhlas ayat \"قُلْ هُوَ ٱللَّهُ أَحَدٌ\" merupakan contoh waqf jenis...", "opts": ["Qabih", "Tam (kerana makna sempurna dan lengkap)", "Ta'anuq", "Ja'iz"], "correct": 1, "diff": "sukar"}]}, {"id": 25, "title": "Ibtida' (Memulakan Bacaan Semula)", "notes": "\n<h3>Definisi</h3>\n<table class=\"tbl\"><tr><th>Bahasa</th><td>Memulakan</td></tr>\n<tr><th>Istilah</th><td>Memulakan semula bacaan al-Quran selepas waqaf (berhenti), sama ada\npada lam ta'rif (qat') atau menyambung semula selepas berhenti (wasal)</td></tr></table>\n<h3>Prinsip Umum</h3>\n<ul>\n<li>Ibtida' menggunakan jenis-jenis yang sama seperti Waqf: Lazim, Tam, Kafi, Hasan, Qabih.</li>\n<li>Tempat memulakan bacaan (ibtida') mestilah dipilih pada permulaan kalimah yang tidak\nmerosakkan makna ayat.</li>\n<li>Ibtida' yang baik adalah pada tempat yang maknanya sempurna dengan sendirinya, sama seperti\nprinsip Waqf Tam / Kafi / Hasan.</li>\n</ul>\n", "questions": [{"q": "Apakah maksud ibtida' dari sudut bahasa?", "opts": ["Berhenti", "Memulakan", "Menyambung", "Mengulang"], "correct": 1, "diff": "mudah"}, {"q": "Ibtida' berlaku selepas...", "opts": ["Sebelum bacaan dimulakan sahaja", "Waqf (berhenti)", "Idgham", "Sukun"], "correct": 1, "diff": "mudah"}, {"q": "Jenis-jenis ibtida' adalah sama seperti jenis-jenis...", "opts": ["Mad", "Waqf", "Idgham", "Qalqalah"], "correct": 1, "diff": "sukar"}, {"q": "Ibtida' yang baik ialah tempat memulakan bacaan yang...", "opts": ["Maknanya sempurna dengan sendirinya", "Berada di tengah kalimah", "Merosakkan makna ayat", "Tidak kira makna"], "correct": 0, "diff": "sukar"}, {"q": "Mengapakah pemilihan tempat ibtida' penting?", "opts": ["Supaya makna ayat tidak tersasar atau mengelirukan", "Supaya bacaan lebih pantas", "Supaya suara lebih kuat", "Tiada kepentingan khusus"], "correct": 0, "diff": "sukar"}, {"q": "Ibtida' hanya boleh dilakukan pada permulaan...", "opts": ["Huruf sahaja", "Kalimah yang sesuai maknanya", "Ayat yang panjang", "Surah baharu sahaja"], "correct": 1, "diff": "mudah"}, {"q": "Ibtida' dan Waqf keduanya berkait rapat dengan menjaga...", "opts": ["Kelajuan bacaan", "Makna dan kesempurnaan ayat", "Bilangan huruf", "Warna mushaf"], "correct": 1, "diff": "mudah"}, {"q": "Selepas berhenti (waqaf) di tengah ayat, pembaca akan menyambung semula bacaan; proses ini dipanggil...", "opts": ["Waqf", "Ibtida'", "Idgham", "Qalqalah"], "correct": 1, "diff": "mudah"}, {"q": "Jika seseorang berhenti pada pertengahan ayat yang maknanya belum sempurna, /* ============================================================
   Rumi -> Jawi transliteration engine (rule-based, best effort).
   Content is authored once in standard Bahasa Melayu (Rumi, DBP

(function (global) {
  // Longest-match-first digraph/trigraph map (phonetic fallback only)
  const MULTI = [
    ["ngg", "ڠڬ"], ["sy", "ش"], ["ng", "ڠ"], ["ny", "ڽ"],
    ["kh", "خ"], ["gh", "غ"]
  ];
  const CONS = {
    b:"ب", t:"ت", c:"چ", d:"د", r:"ر", z:"ز", s:"س", f:"ف",
    g:"ݢ", h:"ه", j:"ج", k:"ک", l:"ل", m:"م", n:"ن", p:"ڤ",
    q:"ق", v:"ۏ", w:"و", x:"کس", y:"ي"
  };
  const VOWEL_STANDALONE = { a: "ا", i: "ي", u: "و", e: "ي", o: "و" };
  const DICT = global.TAJWID_JAWI_DICT || {};

  function translitWord(word) {
    const key = word.toLowerCase();
    if (DICT[key]) return DICT[key];
    let s = key;
    let out = "";
    let i = 0;
    const isVowel = ch => "aeiou".includes(ch);
    while (i < s.length) {
      let matched = false;
      for (const [k, v] of MULTI) {
        if (s.startsWith(k, i)) { out += v; i += k.length; matched = true; break; }
      }
      if (matched) continue;
      const ch = s[i];
      if (/[a-z]/.test(ch)) {
        if (isVowel(ch)) {
          const prevIsCons = i > 0 && /[a-z]/.test(s[i-1]) && !isVowel(s[i-1]);
          if (i === 0 || !prevIsCons) {
            out += VOWEL_STANDALONE[ch] || "";
          }
          i += 1;
        } else if (CONS[ch]) {
          out += CONS[ch];
          i += 1;
        } else {
          i += 1;
        }
      } else {
        out += ch;
        i += 1;
      }
    }
    return out;
  }

  function toJawi(text) {
    if (!text) return "";
    // normalise slashes/other joiners so words on either side still tokenize
    const normalised = text.replace(/\//g, " / ");
    return normalised.split(/(\s+)/).map(tok => {
      if (/^\s+$/.test(tok)) return tok;
      if (/[\u0600-\u06FF]/.test(tok)) return tok; // already Arabic script
      if (tok === "/") return tok;
      const m = tok.match(/^([("'\u201c]*)([\w'-]*)([).,;:!?"'\u201d]*)$/);
      if (!m) return tok;
      const [, pre, core, post] = m;
      if (!core) return tok;

<script>
(function () {
  "use strict";
  const LS_KEY = "tajwid_d456_v2";
  const DATA = window.TAJWID_DATA; // array of 27 topics
  const GLOSSARY = window.TAJWID_GLOSSARY || [];
  const CHART = window.TAJWID_CHART || [];
  const SUMMARY_ID = "summary";
  const TOTAL_Q = DATA.reduce((s, t) => s + t.questions.length, 0);

  // ---------------- State ----------------
  let state = load();
  let mode = "nota"; // 'nota' | 'kuiz' | 'glosari' | 'carta'  (top-level, global)
  let currentTopicId = DATA[0].id;
  // in-memory quiz working state, keyed by topic id, cleared on reload
  // { order:[qIdx...], optOrders:[[idx...]], answers:[selOptIdx|null], graded:bool }
  let quizWork = {};

  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return { rumiOn: false, results: {} }; // results[topicId] = {score,total,state:'started'|'ok'|'bad'}
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  // ---------------- Text rendering helpers ----------------
  function displayText(rumiStr) {
    // Used exclusively with .textContent / attribute values, so NOT escaped here
    // (escaping + textContent would show literal "&amp;" etc. — that was the bug).
    if (state.rumiOn) return rumiStr;
    return window.TajwidTranslit.toJawi(rumiStr);
  }
  function displayTextHtml(rumiStr) {
    // Use only when interpolating into an innerHTML template string.
    return escapeHtml(displayText(rumiStr));
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function renderNotesHtml(rawHtml) {
    const wrap = document.createElement("div");
    wrap.innerHTML = rawHtml;
    if (!state.rumiOn) walkAndTranslit(wrap);
    return wrap.innerHTML;
  }
  function walkAndTranslit(node) {
    for (const child of Array.from(node.childNodes)) {
      if (child.nodeType === 3) {
        if (child.textContent.trim().length) {
          child.textContent = window.TajwidTranslit.toJawi(child.textContent);
        }
      } else if (child.nodeType === 1) {
        const cls = child.className || "";
        if (typeof cls === "string" && (cls.includes("translit") || cls.includes("ayat"))) continue;
        walkAndTranslit(child);
      }
    }
  }
  function tr(rumiWord) { return state.rumiOn ? rumiWord : window.TajwidTranslit.toJawi(rumiWord); }

  // ---------------- Shuffle ----------------
  function shuffled(n) {
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------------- Subtopic chunking (3-5 questions each) ----------------
  function chunkSubtopics(order) {
    const n = order.length;
    const groups = [];
    let target = 4;
    let i = 0, part = 1;
    while (i < n) {
      let size = Math.min(target, n - i);
      if (n - i - size > 0 && n - i - size < 3) size = n - i; // avoid a tiny trailing group
      groups.push({ label: part, idxs: order.slice(i, i + size) });
      i += size; part += 1;
    }
    return groups;
  }

  // ---------------- Quiz work init ----------------
  function ensureQuizWork(topic) {
    if (quizWork[topic.id]) return quizWork[topic.id];
    const order = shuffled(topic.questions.length);
    const optOrders = topic.questions.map(q => shuffled(q.opts.length));
    quizWork[topic.id] = {
      order, optOrders,
      answers: new Array(topic.questions.length).fill(null),
      // per-question status: 'unanswered' | 'selected' | 'correct' | 'wrong'
      qStatus: new Array(topic.questions.length).fill("unanswered"),
      graded: false
    };
    return quizWork[topic.id];
  }
  function resetQuizWork(topic) {
    delete quizWork[topic.id];
    ensureQuizWork(topic);
  }

  // ---------------- Topic chip status ----------------
  function chipStatus(topicId) {
    const w = quizWork[topicId];
    const res = state.results[topicId];
    if (w && w.graded) return res && res.state === "ok" ? "all-correct" : "has-wrong";
    if (res && res.state) return res.state === "ok" ? "all-correct" : "has-wrong";
    if (w && w.answers.some(a => a !== null)) return "started";
    return "";
  }

  // ---------------- Topbar ----------------
  function renderTopbar() {
    document.querySelectorAll(".mode-tab").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
    const gc = document.getElementById("globalCounter");
    if (mode === "kuiz") {
      let answered = 0, correct = 0, gradedTopics = 0;
      DATA.forEach(t => {
        const w = quizWork[t.id];
        if (w) answered += w.answers.filter(a => a !== null).length;
        const res = state.results[t.id];
        if (res) { gradedTopics += 1; correct += res.score; }
      });
      gc.innerHTML = `<b>${answered}</b>/${TOTAL_Q} ${tr("dijawab")} &nbsp;\u2022&nbsp; <b>${correct}</b> ${tr("betul")}`;
    } else {
      gc.textContent = "";
    }
    document.querySelectorAll(".topic-chip[data-id]").forEach(ch => {
      const id = ch.dataset.id;
      ch.classList.toggle("active", String(currentTopicId) === id && mode !== "" );
      ["started", "all-correct", "has-wrong"].forEach(c => ch.classList.remove(c));
      if (id !== SUMMARY_ID) {
        const st = chipStatus(Number(id));
        if (st) ch.classList.add(st);
      }
    });
  }

  function buildTopicRail() {
    const rail = document.getElementById("topicRail");
    rail.innerHTML = "";
    const sumChip = document.createElement("button");
    sumChip.className = "topic-chip summary-chip";
    sumChip.dataset.id = SUMMARY_ID;
    sumChip.textContent = "\u2605 " + tr("Ringkasan");
    sumChip.addEventListener("click", () => goTopic(SUMMARY_ID));
    rail.appendChild(sumChip);
    DATA.forEach(t => {
      const chip = document.createElement("button");
      chip.className = "topic-chip";
      chip.dataset.id = t.id;
      chip.title = displayText(t.title);
      chip.textContent = t.id;
      chip.addEventListener("click", () => goTopic(t.id));
      rail.appendChild(chip);
    });
  }

  // ---------------- Routing ----------------
  function goTopic(id) {
    currentTopicId = id;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function setMode(m) {
    mode = m;
    if (currentTopicId === SUMMARY_ID && (m === "nota" || m === "kuiz")) currentTopicId = DATA[0].id;
    render();
  }

  function render() {
    document.body.classList.toggle("rumi-on", state.rumiOn);
    renderTopbar();
    document.getElementById("topicRail").classList.toggle("hidden", mode === "glosari" || mode === "carta");
    const main = document.getElementById("mainArea");
    main.innerHTML = "";

    if (mode === "glosari") { main.appendChild(renderGlossary()); return; }
    if (mode === "carta") { main.appendChild(renderChart()); return; }

    if (currentTopicId === SUMMARY_ID) {
      main.appendChild(renderSummary());
      return;
    }
    const topic = DATA.find(t => t.id === currentTopicId);
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h1");
    title.className = "page-title";
    title.textContent = topic.id + ". " + displayText(topic.title);
    card.appendChild(title);

    const wave = document.createElement("div");
    wave.className = "wave small";
    card.appendChild(wave);

    if (mode === "nota") {
      const notes = document.createElement("div");
      notes.className = "notes-body";
      notes.innerHTML = renderNotesHtml(topic.notes);
      card.appendChild(notes);
      const goKuiz = document.createElement("div");
      goKuiz.className = "bottom-actions";
      goKuiz.style.position = "static";
      goKuiz.style.margin = "26px 0 0";
      goKuiz.style.border = "none";
      goKuiz.style.padding = "0";
      const btn = document.createElement("button");
      btn.className = "btn btn-primary";
      btn.textContent = tr("Mula Kuiz Topik Ini");
      btn.addEventListener("click", () => { setMode("kuiz"); });
      goKuiz.appendChild(btn);
      card.appendChild(goKuiz);
    } else {
      card.appendChild(renderQuizPage(topic));
    }
    main.appendChild(card);
    renderTopbar();
  }

  // ---------------- Quiz page (single scrollable, grouped by subtopic) ----------------
  function renderQuizPage(topic) {
    const w = ensureQuizWork(topic);
    const groups = chunkSubtopics(w.order);
    const wrap = document.createElement("div");

    const answeredCount = w.answers.filter(a => a !== null).length;
    const bar = document.createElement("div");
    bar.className = "quiz-summary-bar";
    bar.innerHTML = `<span>${answeredCount}/${w.order.length} ${tr("dijawab")}</span>
      <div class="progress-track"><div class="progress-fill" style="width:${(answeredCount / w.order.length) * 100}%"></div></div>`;
    wrap.appendChild(bar);

    groups.forEach(g => {
      const block = document.createElement("div");
      block.className = "subtopic-block";
      const head = document.createElement("div");
      head.className = "subtopic-head";
      head.textContent = tr("Bahagian") + " " + g.label;
      block.appendChild(head);

      g.idxs.forEach(qIdx => {
        block.appendChild(renderQuestionCard(topic, w, qIdx));
      });
      wrap.appendChild(block);
    });

    wrap.appendChild(renderBottomActions(topic, w));
    return wrap;
  }

  function renderQuestionCard(topic, w, qIdx) {
    const q = topic.questions[qIdx];
    const qCard = document.createElement("div");
    qCard.className = "q-card";
    qCard.dataset.qidx = qIdx;

    const stem = document.createElement("div");
    stem.className = "q-stem";

    stem.textContent = displayText(q.q);
    qCard.appendChild(stem);

    const status = w.qStatus[qIdx]; // 'unanswered' | 'selected' | 'correct' | 'wrong'
    const locked = status === "correct"; // only lock once answered correctly

    const optOrder = w.optOrders[qIdx];
    optOrder.forEach(oi => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.type = "button";
      const label = document.createElement("span");
      label.className = "opt-label";
      label.textContent = displayText(q.opts[oi]);
      btn.appendChild(label);

      if (w.answers[qIdx] === oi) btn.classList.add("selected");

      if (locked) {
        // Correct: lock the question, show green on the (now selected) correct option.
        btn.disabled = true;
        if (oi === q.correct) btn.classList.add("correct");
      } else {
        // Wrong or unanswered: stay open for another attempt.
        // Never reveal which option is correct — only flag the wrong pick red.
        if (status === "wrong" && oi === w.answers[qIdx]) btn.classList.add("wrong");
        btn.addEventListener("click", () => {
          w.answers[qIdx] = oi;
          w.qStatus[qIdx] = "selected"; // clear any previous 'wrong' flag on reselect
          render();
        });
      }
      qCard.appendChild(btn);
    });

    return qCard;
  }

  function renderBottomActions(topic, w) {
    const bar = document.createElement("div");
    bar.className = "bottom-actions";

    const anyAnswered = w.answers.some(a => a !== null);
    const allCorrect = w.qStatus.every(s => s === "correct");

    const semak = document.createElement("button");
    semak.className = "btn btn-primary";
    semak.textContent = tr("Semak");
    semak.disabled = !anyAnswered || allCorrect;
    semak.addEventListener("click", () => {
      gradeQuiz(topic, w);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    bar.appendChild(semak);

    const retry = document.createElement("button");
    retry.className = "btn btn-outline";
    retry.textContent = tr("Cuba Lagi");
    retry.addEventListener("click", () => {
      resetQuizWork(topic);
      delete state.results[topic.id];
      save();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    bar.appendChild(retry);

    if (!anyAnswered) {
      const hint = document.createElement("span");
      hint.className = "grade-msg bad";
      hint.textContent = tr("Jawab sekurang-kurangnya satu soalan");
      bar.appendChild(hint);
    } else if (w.graded) {
      const res = state.results[topic.id];
      const msg = document.createElement("span");
      msg.className = "grade-msg " + (res.state === "ok" ? "ok" : "bad");
      msg.textContent = res.state === "ok"
        ? `${res.score}/${res.total} ${tr("Semua betul!")}`
        : `${res.score}/${res.total} ${tr("betul")} \u2014 ${tr("ada yang tersalah, cuba lagi")}`;
      bar.appendChild(msg);
    }
    return bar;
  }

  function gradeQuiz(topic, w) {
    topic.questions.forEach((q, qIdx) => {
      if (w.qStatus[qIdx] === "correct") return; // already locked correct, leave as is
      if (w.answers[qIdx] === null) { w.qStatus[qIdx] = "unanswered"; return; }
      w.qStatus[qIdx] = (w.answers[qIdx] === q.correct) ? "correct" : "wrong";
    });
    const score = w.qStatus.filter(s => s === "correct").length;
    w.graded = true;
    state.results[topic.id] = {
      score, total: topic.questions.length,
      state: score === topic.questions.length ? "ok" : "bad",
      ts: Date.now()
    };
    save();
  }

  // ---------------- Summary / Padam Semua ----------------
  function renderSummary() {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h1");
    title.className = "page-title";
    title.textContent = tr("Ringkasan Kemajuan");
    card.appendChild(title);
    const wave = document.createElement("div");
    wave.className = "wave small";
    card.appendChild(wave);

    let attempted = 0, totalScore = 0, totalMax = 0;
    const grid = document.createElement("div");
    grid.className = "summary-grid";
    DATA.forEach(t => {
      const res = state.results[t.id];
      const item = document.createElement("div");
      item.className = "summary-item";
      if (res) {
        attempted += 1; totalScore += res.score; totalMax += res.total;
        const pct = Math.round((res.score / res.total) * 100);
        item.innerHTML = `<div class="ttl">${t.id}. ${displayTextHtml(t.title)}</div>
          <div class="stat">${res.score}/${res.total} (${pct}%)</div>
          <div class="mini-bar"><div class="mini-fill" style="width:${pct}%;background:${res.state === "ok" ? "var(--green)" : "var(--red)"}"></div></div>`;
      } else {
        item.innerHTML = `<div class="ttl">${t.id}. ${displayTextHtml(t.title)}</div>
          <div class="stat">${tr("Belum dicuba")}</div>`;
      }
      item.style.cursor = "pointer";
      item.addEventListener("click", () => { mode = "kuiz"; goTopic(t.id); });
      grid.appendChild(item);
    });
    card.appendChild(grid);

    const overall = document.createElement("p");
    overall.className = "subtle";
    overall.style.marginTop = "16px";
    overall.textContent = `${tr("Topik dicuba")}: ${attempted}/${DATA.length}` +
      (totalMax ? ` \u2014 ${tr("Jumlah markah")}: ${totalScore}/${totalMax}` : "") +
      ` \u2014 ${TOTAL_Q} ${tr("soalan keseluruhan")}`;
    card.appendChild(overall);

    const footer = document.createElement("footer");
    footer.className = "danger-zone";
    const note = document.createElement("p");
    note.textContent = tr("Padam semua rekod markah dan mula semula dari kosong.");
    footer.appendChild(note);
    const delBtn = document.createElement("button");
    delBtn.className = "btn btn-danger";
    delBtn.textContent = tr("Padam Semua");
    delBtn.addEventListener("click", () => {
      const msg = tr(`Padam SEMUA markah kuiz untuk ${DATA.length} topik? Tindakan ini tidak boleh dibatalkan.`);
      if (confirm(msg)) {
        state.results = {};
        save();
        quizWork = {};
        render();
      }
    });
    footer.appendChild(delBtn);
    card.appendChild(footer);
    return card;
  }

  // ---------------- Glosari ----------------
  function renderGlossary() {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h1");
    title.className = "page-title";
    title.textContent = tr("Glosari & Definisi");
    card.appendChild(title);
    const wave = document.createElement("div");
    wave.className = "wave small";
    card.appendChild(wave);
    const sub = document.createElement("p");
    sub.className = "subtle";
    sub.textContent = `${GLOSSARY.length} ${tr("istilah")} \u2014 ${tr("disusun mengikut abjad")}`;
    card.appendChild(sub);

    const jump = document.createElement("div");
    jump.className = "glossary-jump";
    const seenLetters = new Set();
    GLOSSARY.forEach(g => {
      const letter = g.term[0].toUpperCase();
      if (!seenLetters.has(letter)) {
        seenLetters.add(letter);
        const a = document.createElement("a");
        a.href = "#gloss-" + letter;
        a.textContent = letter;
        jump.appendChild(a);
      }
    });
    card.appendChild(jump);

    const list = document.createElement("div");
    list.className = "glossary-list";
    const seen2 = new Set();
    GLOSSARY.forEach(g => {
      const letter = g.term[0].toUpperCase();
      const item = document.createElement("div");
      item.className = "glossary-item";
      if (!seen2.has(letter)) { item.id = "gloss-" + letter; seen2.add(letter); }
      const term = document.createElement("div");
      term.className = "glossary-term";
      term.textContent = displayText(g.term);
      const def = document.createElement("div");
      def.className = "glossary-def";
      def.textContent = displayText(g.def);
      item.appendChild(term);
      item.appendChild(def);
      list.appendChild(item);
    });
    card.appendChild(list);
    return card;
  }

  // ---------------- Carta Lengkap ----------------
  function renderChart() {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h1");
    title.className = "page-title";
    title.textContent = tr("Carta Lengkap Hukum Tajwid");
    card.appendChild(title);
    const wave = document.createElement("div");
    wave.className = "wave small";
    card.appendChild(wave);
    const hint = document.createElement("p");
    hint.className = "chart-hint";
    hint.textContent = tr("Leret ke kanan/kiri untuk lihat lajur penuh. Tekan nombor topik untuk baca Nota lengkap.");
    card.appendChild(hint);

    const scrollWrap = document.createElement("div");
    scrollWrap.className = "chart-scroll";
    const table = document.createElement("table");
    table.className = "chart-tbl";
    const thead = document.createElement("tr");
    [tr("Hukum"), tr("Maksud"), tr("Contoh"), tr("Cara Baca"), tr("Sebab / Mengapa"), tr("Topik")].forEach(h => {
      const th = document.createElement("th");
      th.textContent = h;
      thead.appendChild(th);
    });
    table.appendChild(thead);

    CHART.forEach(row => {
      const tr_ = document.createElement("tr");
      const c1 = document.createElement("td"); c1.textContent = displayText(row.rule);
      const c2 = document.createElement("td"); c2.textContent = displayText(row.meaning);
      const c3 = document.createElement("td"); c3.className = "ar-ex"; c3.textContent = row.example;
      const c4 = document.createElement("td"); c4.textContent = displayText(row.how);
      const c5 = document.createElement("td"); c5.textContent = displayText(row.why);
      const c6 = document.createElement("td");
      const link = document.createElement("button");
      link.className = "chart-topic-link";
      link.textContent = row.topic;
      link.addEventListener("click", () => { setMode("nota"); goTopic(row.topic); });
      c6.appendChild(link);
      tr_.appendChild(c1); tr_.appendChild(c2); tr_.appendChild(c3);
      tr_.appendChild(c4); tr_.appendChild(c5); tr_.appendChild(c6);
      table.appendChild(tr_);
    });
    scrollWrap.appendChild(table);
    card.appendChild(scrollWrap);
    return card;
  }

  // ---------------- Init ----------------
  function init() {
    document.body.classList.toggle("rumi-on", state.rumiOn);
    const toggle = document.getElementById("rumiToggle");
    toggle.checked = state.rumiOn;
    toggle.addEventListener("change", () => {
      state.rumiOn = toggle.checked;
      save();
      buildTopicRail();
      render();
    });
    document.querySelectorAll(".mode-tab").forEach(b => {
      b.addEventListener("click", () => setMode(b.dataset.mode));
    });
    buildTopicRail();
    render();
  }
  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
